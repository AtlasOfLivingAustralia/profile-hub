name: "profile-hub build"

on:
  push:
    branches:
      - dev
      - master
      - feature/**
      - hotfix/**

env:
  TZ: Australia/Canberra

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Read the profile-hub version from the gradle.properties file
        id: read_property
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: './gradle.properties'
          properties: 'profileHubVersion'

      - name: Delete the github package versions for this SNAPSHOT
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          owner: ${{ github.repository_owner }}
          package-name: au.org.ala.profile-hub
          package-type: maven
          min-versions-to-keep: 0
          ignore-versions: '^(?!${{ steps.read_property.outputs.profileHubVersion }}$).*$'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run javascript unit tests
        run: node_modules/karma/bin/karma start karma.conf.js --single-run --browsers ChromeHeadless

      - name: Clean to remove clover instrumentation
        run: ./gradlew clean

      - name: Publish the JAR to the repository
        run: ./gradlew check publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
