<div class="modal-header">
    <h4 class="modal-title">Glossary Item</h4>
    <close-modal close="glossaryModalCtrl.cancel()"></close-modal>
</div>

<div class="modal-body">
    <alert class="alert-danger" ng-show="glossaryModalCtrl.error">{{ glossaryModalCtrl.error }}</alert>

    <div class="mb-3">
        <label for="term" class="form-label">Term</label>
        <input id="term" type="text"
               ng-model="glossaryModalCtrl.item.term"
               class="form-control"
               ng-enter="glossaryModalCtrl.ok()"
               ng-disabled="glossaryModalCtrl.item.uuid"/>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description"
                  ng-model="glossaryModalCtrl.item.description"
                  class="form-control"
                  ng-enter="glossaryModalCtrl.ok()"
                  rows="6"></textarea>
    </div>
</div>

<div class="modal-footer">
    <button class="btn btn-primary" ng-click="glossaryModalCtrl.ok()">OK</button>
    <button class="btn btn-outline-secondary" ng-click="glossaryModalCtrl.cancel()">Cancel</button>
</div>
