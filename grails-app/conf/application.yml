---
grails:
    profile: web
    codegen:
        defaultPackage: au.org.ala.profile.hub
    cache:
        ehcache:
            ehcacheXmlLocation: 'classpath:profile-ehcache.xml'
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false

info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'

spring:
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback.groovy'
                - 'grails-app/conf/logback.groovy'
                - '*.properties'

management:
    endpoints:
        enabled-by-default: false
        jmx:
            unique-names: true

---
grails:
    mime:
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf:
              - application/pdf
              - application/x-pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        upload:
            maxFileSize: 5000000
            maxRequestSize: 5000000
        defaultScope: singleton
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

server:
    forward-headers-strategy: native
    tomcat:
        remoteip:
            port-header: 'X-Forwarded-Port'
            protocol-header: 'X-Forwarded-Proto'
            remote-ip-header: 'X-Forwarded-For'

---
grails:
    config:
        locations:
            - file:/data/profile-hub/config/profile-hub-config.properties
            - file:/data/profile-hub/config/profile-hub-config.yml
            - file:/data/profile-hub/config/profile-hub-config.groovy

---
# Override grails.cors.allowedOrigins in external config (comma-separated in .properties).
# allowCredentials is on, so allowedOrigins must stay an explicit list — Spring rejects '*'.
# Keep these settings flat: under grails.cors.mappings the '/**' path key is lost during
# binding, leaving every request without a CORS configuration.
grails:
    cors:
        enabled: true
        allowedOrigins:
            - https://profiles-react-ui-rebuild.dev.ala.org.au
            - https://profiles.dev.ala.org.au
            - https://profile-staging.ala.org.au
            - https://profiles.ala.org.au
        allowedMethods:
            - GET
            - HEAD
            - POST
            - PUT
            - DELETE
            - OPTIONS
        allowedHeaders:
            - '*'
        allowCredentials: true
        maxAge: 3600

---
security:
    cas:
        enabled: false
        adminRole: 'ROLE_ADMIN'
        uriExclusionFilterPattern:
            - '/assets/.*'
            - '/openapi.*'
            - '/webjars/.*'
            - '/api/.*'
        uriFilterPattern: []
        # Do NOT use '*' here. With credentials:include, a present ALA-Auth cookie makes
        # every fetch/XHR hit Pac4j's interactive OIDC SecurityFilter and 302 to Cognito
        # (CORS failure). Public APIs stay anonymous; JWT Bearer is handled separately.
        # Interactive login remains available via /login and @SSO for browser pages.
        authenticateOnlyIfCookieFilterPattern: []
        authenticateOnlyIfLoggedInFilterPattern: []
    oidc:
        enabled: true
        discoveryUri: https://auth.ala.org.au/cas/oidc/.well-known
        scope: "openid,profile,email,ala,roles"
        clientId: some-client-id
        secret: some-client-secret
        allowUnsignedIdTokens: true
    jwt:
        enabled: true
        discoveryUri: https://auth.ala.org.au/cas/oidc/.well-known
        fallbackToLegacyBehaviour: true
        # Cognito access tokens omit some CAS-oriented claims; keep validation workable.
        requiredClaims:
            - sub
            - iat
            - exp
            - iss

---
webservice:
    jwt: true
    jwt-include-legacy-headers: true
    jwt-scopes: "openid profile email ala roles profile-service/write users/read"

---
biocache:
    wms:
        layer: 'ALA:occurrences'

app:
    http:
        header:
            userName: "X-ALA-userName"
    analytics:
        apiid: cd1
        userid: cd2
        collectionid: cd3
        profileid: cd4

---
openapi:
    title: Profiles APIs
    description: APIs to query a collection in profiles
    terms: https://www.ala.org.au/terms
    contact:
        name: Support
        email: support@ala.org.au
    license:
        name: Mozilla Public License 1.1
        url: https://www.mozilla.org/en-US/MPL/1.1/
    version: '@info.app.version@'
    cachetimeoutms: 0
    components:
        security:
            oauth2:
                password-flow-enabled: true
                baseUrl: https://auth.ala.org.au/cas/oidc
                scopes:
                    openid: "openid scope"
                    profile: "profile scope"
                    email: "email scope"
                    ala: "ala scope"
                    roles: "user role"