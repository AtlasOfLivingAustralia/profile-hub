<div class="modal-header">
  <h4 class="modal-title" id="modal-confirm-title">{{ title }}</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="cancel()"
  ></button>
</div>
<div class="modal-body">
  <p>{{ message }}</p>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-primary"
    ngbAutofocus
    (click)="ok()"
  >
    OK
  </button>
  <button
    type="button"
    class="btn btn-outline-secondary"
    (click)="cancel()"
  >
    Cancel
  </button>
</div>
