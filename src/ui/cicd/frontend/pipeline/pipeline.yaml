AWSTemplateFormatVersion: "2010-09-09"

Description: Code pipeline for the Profiles UI

Parameters:
  pAllowTeardown:
    Description: enables or disables the teardown stage
    Type: String
    AllowedValues:
      - true
      - false

  pAutoDeploy:
    Description: Sets the pipeline to autodeploy on repo changes
    Type: String

  pBootstrapStackName:
    Description: The name of the bootstrap stack
    Type: String

  pBucketsStackName:
    Description: The name of the bucket stack
    Type: String

  pCleanBranch:
    Description: A cleaned version of the code branch name
    Type: String
    Default: development

  pEnvironment:
    Description: The AWS environment this belongs to
    Type: String

  pGitHubRepositoryName:
    Description: GitHub repository name.
    Type: String

  pGitHubOwner:
    Description: GitHub owner
    Type: String

  pGitHubBranch:
    Description: GitHub branch we're deploying from
    Type: String

  pPipelineFingerprint:
    Description: The fingerprint of the pipeline, used to determine if it's been modified
    Type: String

  pProductComponent:
    Description: The name of the product component
    Type: String

  pProductName:
    Description: The name of the product
    Type: String

  pRestartExecutionOnUpdate:
    Description: Restart that pipeline if it's been updated
    Type: String
    AllowedValues:
      - true
      - false

  pUsEast1CodePipelineArtifactBucketName:
    Description: The us-east-1 CodePipeline artifact bucket name
    Type: String

Conditions:
  IsDev: !Equals
    - !Ref pEnvironment
    - development

  IsProd: !Equals
    - !Ref pEnvironment
    - production

  AutoDeploy: !Equals
    - !Ref pAutoDeploy
    - true

  AllowTeardown: !Equals
    - !Ref pAllowTeardown
    - true

Resources:
  ExportConfig:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
        - ${pProductName}-${pProductComponent}-export-config-${ResourceName}
        - ResourceName: !If
            - IsDev
            - !Ref pCleanBranch
            - !Ref pEnvironment
      Description: Load the environment and build the CloudFormation template config file
      ServiceRole: !ImportValue
        Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub src/ui/cicd/${pProductComponent}/pipeline/export_config_buildspec.yaml
      TimeoutInMinutes: 5

  BuildCode:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
        - ${pProductName}-${pProductComponent}-build-site-${ResourceName}
        - ResourceName: !If
            - IsDev
            - !Ref pCleanBranch
            - !Ref pEnvironment
      Description: Build the Profiles UI
      ServiceRole: !ImportValue
        Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub src/ui/cicd/${pProductComponent}/pipeline/npm_build_buildspec.yaml
      TimeoutInMinutes: 10

  EmptyBucket:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
        - ${pProductName}-${pProductComponent}-empty-bucket-${ResourceName}
        - ResourceName: !If
            - IsDev
            - !Ref pCleanBranch
            - !Ref pEnvironment
      Description: Empty the source s3 bucket so it can be deleted
      ServiceRole: !ImportValue
        Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub src/ui/cicd/${pProductComponent}/pipeline/empty_bucket_buildspec.yaml
      TimeoutInMinutes: 5

  DeployNotification:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
        - ${pProductName}-${pProductComponent}-deploy-notification-${ResourceName}
        - ResourceName: !If
            - IsDev
            - !Ref pCleanBranch
            - !Ref pEnvironment
      Description: Send out the deploy notifications
      ServiceRole: !ImportValue
        Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub src/ui/cicd/${pProductComponent}/pipeline/deploy_notification_buildspec.yaml
      TimeoutInMinutes: 5

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub
        - ${pProductName}-${pProductComponent}-${ResourceName}
        - ResourceName: !If
            - IsDev
            - !Ref pCleanBranch
            - !Ref pEnvironment
      PipelineType: V2
      RoleArn: !ImportValue
        Fn::Sub: ${pBootstrapStackName}-CodePipelineServiceRoleArn
      ArtifactStores:
        - ArtifactStore:
            Type: S3
            Location: !Ref pUsEast1CodePipelineArtifactBucketName
          Region: us-east-1
        - ArtifactStore:
            Type: S3
            Location: !ImportValue
              Fn::Sub: ${pBucketsStackName}-${AWS::Region}-CodePipelineArtifactBucketName
          Region: !Ref AWS::Region
      DisableInboundStageTransitions: !If
        - AllowTeardown
        - - Reason: To prevent accidental teardown
            StageName: Teardown
        - !Ref AWS::NoValue
      RestartExecutionOnUpdate: !Ref pRestartExecutionOnUpdate
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            Push:
              - Branches:
                  Includes:
                    - !If
                      - AutoDeploy
                      - !Ref pGitHubBranch
                      - bogo-branch
                FilePaths:
                  Includes:
                    - src/ui/**
            SourceActionName: CheckoutSrc
      Variables:
        - Name: SRC_BRANCH
          DefaultValue: !Ref pGitHubBranch
          Description: The branch this pipeline is deploying from
        - Name: PIPELINE_FINGERPRINT
          DefaultValue: !Ref pPipelineFingerprint
          Description: The fingerprint of the pipeline, used to determine if it's been modified
      Stages:
        - Name: Checkout_Source
          Actions:
            - Name: CheckoutSrc
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              Configuration:
                ConnectionArn: !ImportValue
                  Fn::Sub: ${pBootstrapStackName}-CodestarConnectionArn
                FullRepositoryId: !Sub ${pGitHubOwner}/${pGitHubRepositoryName}
                BranchName: !Ref pGitHubBranch
                OutputArtifactFormat: CODEBUILD_CLONE_REF
                DetectChanges: !Ref pAutoDeploy
              Namespace: CheckoutSrcNS
              OutputArtifacts:
                - Name: ProfilesSourceArtifact
        - Name: Deploy_Infrastructure
          Actions:
            - Name: ExportConfig
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref ExportConfig
                EnvironmentVariables: !Sub
                  - |
                    [
                     { "name": "ARTIFACTS_BUCKET", "value":"${ArtifactsBucket}" },
                     { "name": "AUTHOR", "value": "#{CheckoutSrcNS.AuthorDisplayName}" },
                     { "name": "CLEAN_BRANCH", "value":"${pCleanBranch}" },
                     { "name": "COMMIT_ID", "value":"#{CheckoutSrcNS.CommitId}" },
                     { "name": "ENVIRONMENT", "value":"${pEnvironment}" },
                     { "name": "EXECUTION_ID", "value":"#{codepipeline.PipelineExecutionId}" },
                     { "name": "PIPELINE_FINGERPRINT", "value":"#{variables.PIPELINE_FINGERPRINT}" },
                     { "name": "PRODUCT_COMPONENT", "value":"${pProductComponent}" },
                     { "name": "PRODUCT_NAME", "value":"${pProductName}" },
                     { "name": "REPO", "value":"#{CheckoutSrcNS.FullRepositoryName}" },
                     { "name": "SRC_BRANCH", "value":"${pGitHubBranch}" }
                    ]
                  - ArtifactsBucket: !ImportValue
                      Fn::Sub: ${pBucketsStackName}-${AWS::Region}-CodePipelineArtifactBucketName
              Namespace: ExportConfigNS
              InputArtifacts:
                - Name: ProfilesSourceArtifact
              OutputArtifacts:
                - Name: ExportConfigArtifact
              RunOrder: 1
            - Name: DeployWafCFStack
              ActionTypeId:
                Owner: AWS
                Category: Deploy
                Version: 1
                Provider: CloudFormation
              Configuration:
                TemplatePath: !Sub ExportConfigArtifact::src/ui/cicd/${pProductComponent}/app/#{ExportConfigNS.WAF_STACK_FILE_PFIX}.yaml
                TemplateConfiguration: !Sub ExportConfigArtifact::src/ui/cicd/${pProductComponent}/app/#{ExportConfigNS.WAF_STACK_FILE_PFIX}_template_config.json
                ActionMode: !If
                  - IsDev
                  - REPLACE_ON_FAILURE
                  - CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !ImportValue
                  Fn::Sub: ${pBootstrapStackName}-CloudFormationServiceRoleArn
                StackName: '#{ExportConfigNS.WAF_STACK_NAME}'
              InputArtifacts:
                - Name: ExportConfigArtifact
              Namespace: WafCloudFormationOutNS
              OutputArtifacts: []
              Region: us-east-1
              RunOrder: 2
            - Name: DeploySiteCFStack
              ActionTypeId:
                Owner: AWS
                Category: Deploy
                Version: 1
                Provider: CloudFormation
              Configuration:
                TemplatePath: !Sub ExportConfigArtifact::src/ui/cicd/${pProductComponent}/app/#{ExportConfigNS.APP_STACK_FILE_PFIX}.yaml
                TemplateConfiguration: !Sub ExportConfigArtifact::src/ui/cicd/${pProductComponent}/app/#{ExportConfigNS.APP_STACK_FILE_PFIX}_template_config.json
                ActionMode: !If
                  - IsDev
                  - REPLACE_ON_FAILURE
                  - CREATE_UPDATE
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                ParameterOverrides: |
                  {
                    "pProfilesWafWebAclArn": "#{WafCloudFormationOutNS.ProfilesWafWebAclArn}"
                  }
                RoleArn: !ImportValue
                  Fn::Sub: ${pBootstrapStackName}-CloudFormationServiceRoleArn
                StackName: '#{ExportConfigNS.APP_STACK_NAME}'
              InputArtifacts:
                - Name: ExportConfigArtifact
              Namespace: AppCloudFormationOutNS
              OutputArtifacts: []
              RunOrder: 3
        - Name: Publish_Website
          Actions:
            - Name: BuildCode
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref BuildCode
                PrimarySource: ProfilesSourceArtifact
                EnvironmentVariables: |
                  [
                   { "name": "NODE_VERSION", "value":"#{ExportConfigNS.NODE_VERSION}" }
                  ]
              Namespace: BuildProfilesNS
              InputArtifacts:
                - Name: ProfilesSourceArtifact
                - Name: ExportConfigArtifact
              OutputArtifacts:
                - Name: BuildProfilesArtifact
              RunOrder: 1
            - Name: EmptyBucket
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref EmptyBucket
              Namespace: EmptyBucketPreDeployNS
              InputArtifacts:
                - Name: ExportConfigArtifact
              RunOrder: 2
            - Name: UploadFilesToS3
              ActionTypeId:
                Owner: AWS
                Category: Deploy
                Version: 1
                Provider: S3
              Configuration:
                BucketName: '#{ExportConfigNS.SOURCE_BUCKET}'
                ObjectKey: '#{ExportConfigNS.BUCKET_PATH}'
                Extract: "true"
                CacheControl: public, max-age=#{ExportConfigNS.MAX_AGE}
              OutputArtifacts: []
              InputArtifacts:
                - Name: BuildProfilesArtifact
              RunOrder: 3
            - Name: DeployNotification
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref DeployNotification
              Namespace: DeployNotificationNS
              InputArtifacts:
                - Name: ExportConfigArtifact
              RunOrder: 5
        - !If
          - AllowTeardown
          - Name: Teardown
            Actions:
              - Name: Approval
                ActionTypeId:
                  Owner: AWS
                  Category: Approval
                  Version: 1
                  Provider: Manual
                Configuration:
                  CustomData: Approval required to tear down this stack
                RunOrder: 1
              - Name: EmptyBucket
                ActionTypeId:
                  Owner: AWS
                  Category: Build
                  Version: 1
                  Provider: CodeBuild
                Configuration:
                  ProjectName: !Ref EmptyBucket
                Namespace: EmptyBucketPreDeleteNS
                InputArtifacts:
                  - Name: ExportConfigArtifact
                RunOrder: 2
              - Name: TeardownProfilesSite
                ActionTypeId:
                  Owner: AWS
                  Category: Deploy
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: '#{ExportConfigNS.APP_STACK_NAME}'
                  RoleArn: !ImportValue
                    Fn::Sub: ${pBootstrapStackName}-CloudFormationServiceRoleArn
                RunOrder: 3
              - Name: TeardownProfilesWaf
                ActionTypeId:
                  Owner: AWS
                  Category: Deploy
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: '#{ExportConfigNS.WAF_STACK_NAME}'
                  RoleArn: !ImportValue
                    Fn::Sub: ${pBootstrapStackName}-CloudFormationServiceRoleArn
                Region: us-east-1
                RunOrder: 4
              - Name: ApprovalForPipelineTeardown
                ActionTypeId:
                  Owner: AWS
                  Category: Approval
                  Version: 1
                  Provider: Manual
                Configuration:
                  CustomData: Approval required to tear down this stack
                RunOrder: 5
              - Name: TeardownCodePipeline
                ActionTypeId:
                  Owner: AWS
                  Category: Deploy
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: !Ref AWS::StackName
                  RoleArn: !ImportValue
                    Fn::Sub: ${pBootstrapStackName}-CloudFormationServiceRoleArn
                RunOrder: 6
          - !Ref AWS::NoValue

  ExportConfigLogGroup:
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${ExportConfig}
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  BuildCodeLogGroup:
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${BuildCode}
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  EmptyBucketLogGroup:
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${EmptyBucket}
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  DeployNotificationCodeBuildLogGroup:
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${DeployNotification}
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

Outputs:
  PipelineUrl:
    Value: !Sub https://console.aws.amazon.com/codepipeline/home?region=${AWS::Region}#/view/${Pipeline}
